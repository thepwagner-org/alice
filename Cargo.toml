[package]
name = "alice"
version = "0.0.0-dev"
edition = "2021"
description = "A sanitizing HTTPS proxy for controlled network access"
license = "MIT"

[[bin]]
name = "alice"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
non_ascii_idents = "forbid"
missing_unsafe_on_extern = "forbid"
unused_results = "warn"
missing_debug_implementations = "warn"
variant_size_differences = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP/TLS
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
h2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
webpki-roots = "1"

# DNS
hickory-resolver = "0.26"

# Config & CLI
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Patterns
globset = "0.4"
ipnet = "2"
regex = "1"

# Caching
moka = { version = "0.12", features = ["future"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# OpenTelemetry
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-client"] }
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.33"

# Error handling
thiserror = "2"
anyhow = "1"

# Metrics
prometheus = "0.14"

# JWT / GCP auth
jsonwebtoken = { version = "10", features = ["rust_crypto", "use_pem"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
url = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

# Compression
flate2 = "1"

# Misc
time = "0.3"
base64 = "0.22"
secrecy = "0.10"
subtle = "2"  # Constant-time credential comparison (proxy Basic auth)
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

# Used by the sanctum gRPC client to talk to the credential broker.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }

# sanctum gRPC API (client in src/credentials.rs). The wire schema and its
# tonic codegen live in the sanctum-client crate, so alice does not define
# the proto itself.
# `tower::service_fn` builds the UDS connector for tonic's `connect_with_connector`.
sanctum-client = { path = "vendor/sanctum-client" }
tonic = "0.14"
prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[features]
default = []

[dev-dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
pem = "3"
tempfile = "3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

# Re-export rustls with ring feature for tests (crypto provider)
[dev-dependencies.rustls]
version = "0.23"
features = ["ring"]
