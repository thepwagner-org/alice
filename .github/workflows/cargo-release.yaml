name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          meta=$(cargo metadata --format-version=1 --no-deps)
          pkg=$(printf '%s' "$meta" | jq -r '.packages[0].name')
          bins=$(printf '%s' "$meta" | jq -r '.packages[0].targets[] | select(.kind[] == "bin") | .name')
          # shellcheck disable=SC2086
          tar czf "${pkg}-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" $bins
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: '*.tar.gz'

  release:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ./*.tar.gz > checksums-sha256.txt
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: '*.tar.gz'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
          ./*.tar.gz checksums-sha256.txt
